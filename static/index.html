<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.blocked{color:#8a1f11}.ok{color:#1f6b2a}</style><h1>数字人文文本校勘</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><pre id="result"></pre></section><section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section><section><h2>散页回补</h2><div class="grid"><input id="leaf_witness" type="number" placeholder="版本 ID"><input id="leaf_passage" type="number" placeholder="段落 ID"><input id="leaf_user" type="number" placeholder="用户 ID"><input id="leaf_no" placeholder="叶序（如 叶三）"><input id="leaf_img" placeholder="影像编号"><input id="leaf_id" type="number" placeholder="回补记录 ID"><textarea id="leaf_text" placeholder="散页释文">春水东流，故人南去。</textarea></div><button onclick="regLeaf()">登记散页</button><button onclick="reviewLeaf(1)">负责人复核通过并替换该叶</button><button onclick="reviewLeaf(0)">复核驳回</button><pre id="leaf_result"></pre></section><section><h2>定本生成</h2><input id="def_work" type="number" placeholder="作品 ID"><input id="def_user" type="number" placeholder="用户 ID"><button onclick="definitive()">生成定本</button><div id="def_list"></div><pre id="def_result"></pre></section><script>const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}function regLeaf(){post('/api/leaves',{witness_id:+leaf_witness.value,passage_id:+leaf_passage.value,leaf_no:leaf_no.value,image_ref:leaf_img.value,transcription:leaf_text.value,user_id:+leaf_user.value},'#leaf_result')}function reviewLeaf(ok){post('/api/leaves/'+leaf_id.value+'/review',{user_id:+leaf_user.value,approve:!!ok},'#leaf_result')}async function definitive(){const d=await(await fetch('/api/works/'+def_work.value+'/definitive?user_id='+def_user.value)).json();show('#def_result',d);const list=document.querySelector('#def_list');if(!d.passages){list.innerHTML='';return}list.innerHTML=d.passages.map(p=>p.blocked?'<p class="blocked">✖ '+p.label+'：含待重校内容，不能生成定本<ul>'+p.blockers.map(b=>'<li>叶序 '+b.leaf_no+' ｜ 来源 '+b.source+' ｜ 影像 '+b.image_ref+' ｜ 阻挡原因：'+b.reason+'</li>').join('')+'</ul></p>':'<p class="ok">✔ '+p.label+'：'+(p.definitive_text||'')+'</p>').join('')}state()</script></html>
