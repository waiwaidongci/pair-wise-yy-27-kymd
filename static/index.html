<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d6d0c4;padding:6px;text-align:left}.blocked{color:#8c2f1b}</style><h1>数字人文文本校勘</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><pre id="result"></pre></section><section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section><section><h2>散页回补</h2><div class="grid"><input id="leafSeq" placeholder="叶序，如 叶三"><input id="imageRef" placeholder="影像编号，如 IMG-003"><textarea id="leafText" placeholder="散页释文"></textarea></div><button onclick="registerLeaf()">登记回补</button><button onclick="listLeaves()">查看本作回补记录</button><h3>负责人复核</h3><input id="leafId" type="number" placeholder="回补 ID"><button onclick="reviewLeaf(true)">复核通过并替换该叶</button><button onclick="reviewLeaf(false)">驳回</button><pre id="leafResult"></pre><div id="leafList"></div></section><section><h2>定本生成</h2><button onclick="definitive()">生成定本</button><pre id="defResult"></pre><div id="defBlocks"></div></section><script>const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}const STATUS={pending:'待复核',recollation:'待重校',approved:'已替换',rejected:'已驳回'};function registerLeaf(){post('/api/leaves',{witness_id:+witness.value,leaf_seq:leafSeq.value,image_ref:imageRef.value,transcription:leafText.value,user_id:+user.value},'#leafResult')}function reviewLeaf(approve){post('/api/leaves/'+leafId.value+'/review',{user_id:+user.value,approve},'#leafResult')}async function listLeaves(){const d=await(await fetch('/api/works/'+work.value+'/leaves?user_id='+user.value)).json();show('#leafResult',d);const rows=(d.leaves||[]).map(l=>`<tr><td>${l.id}</td><td>${l.siglum}</td><td>${l.leaf_seq}</td><td>${l.image_ref}</td><td>${STATUS[l.status]||l.status}</td><td>${l.transcription}</td></tr>`).join('');document.querySelector('#leafList').innerHTML=rows?`<table><tr><th>ID</th><th>版本</th><th>叶序</th><th>影像编号</th><th>状态</th><th>释文</th></tr>${rows}</table>`:''}async function definitive(){const d=await(await fetch('/api/passages/'+passage.value+'/definitive?user_id='+user.value)).json();show('#defResult',d);const rows=(d.blocks||[]).map(b=>`<tr class="blocked"><td>${b.leaf_seq}</td><td>${b.source}</td><td>${b.reason}</td></tr>`).join('');document.querySelector('#defBlocks').innerHTML=rows?`<p class="blocked">该段落有待重校内容，不能生成定本：</p><table><tr><th>叶序</th><th>来源</th><th>阻挡原因</th></tr>${rows}</table>`:''}state()</script></html>
